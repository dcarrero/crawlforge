# Integración continua del motor.
#
# Tres cosas, en orden de lo que más duele que se rompa:
#
# 1. Que compile y pasen los tests en las tres plataformas. El motor toca el sistema de
#    ficheros, y ahí rutas, separadores y mayúsculas se comportan distinto en cada una.
# 2. Clippy sin avisos. Es la convención del proyecto, no una preferencia.
# 3. La regresión de rendimiento. La velocidad y la memoria son el argumento del
#    producto y se pierden en un push cualquiera sin que nadie se entere.

name: CI

# **En cada push a `main` y en cada pull request**, desde el 2026-08-10. Hasta ese día era solo
# manual porque el repositorio era privado y cada ejecución gastaba minutos de la cuota de la
# cuenta; al abrirlo, los runners estándar pasaron a ser gratuitos y la razón desapareció.
#
# `workflow_dispatch` se queda: sigue haciendo falta poder lanzarlo a mano antes de una
# publicación sin tener que inventarse un commit.
#
#   gh workflow run CI
#
# Esto **no sustituye a `tools/verificar.sh`**, que sigue siendo lo que hay que pasar antes de
# subir: corre lo mismo, en el acto, y sin esperar a un runner. El pipeline está para lo que en
# local no se puede probar — Windows, sobre todo, que es donde las rutas y los separadores se
# comportan distinto.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  # Nada de `RUSTFLAGS: -D warnings` global: eso aplica también a las dependencias de terceros y
  # rompe la compilación por avisos que no son nuestros. El rigor va en el paso de clippy, que es
  # donde corresponde.

jobs:
  test:
    name: Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      # Sin fail-fast: si algo se rompe solo en Windows, interesa ver que Linux va bien.
      fail-fast: false
      matrix:
        # Las tres, desde el 2026-08-10. macOS estuvo fuera mientras el repositorio era privado,
        # porque GitHub factura sus runners a **10x** —un job de 12 minutos se cobraba como 120—
        # y era la máquina de desarrollo, cubierta en local por `tools/suite.sh`, que además hace
        # más: usa la herramienta de verdad, audita, exporta, informa y abre el `.xlsx`.
        #
        # Al abrir el repositorio los runners estándar pasaron a ser gratuitos, macOS incluido, y
        # ese argumento desapareció. Queda el que de verdad importa ahora: **este repositorio
        # acepta pull requests de gente que no tiene este Mac**. «Se verifica en local» cubre lo
        # que escribimos nosotros y nada de lo que llegue de fuera.
        #
        # Y macOS no es Linux con otro nombre para este motor: APFS no distingue mayúsculas por
        # defecto y normaliza los nombres de fichero en NFD en vez de NFC. Un rastreador que
        # escribe ficheros y compara rutas se rompe exactamente ahí.
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      # La caché es lo que hace que esto tarde minutos y no decenas de minutos: `rusqlite` viene
      # con SQLite empaquetado y compilarlo cada vez domina el tiempo del pipeline.
      - uses: Swatinem/rust-cache@v2

      - name: Compilar
        run: cargo build --workspace --all-targets

      - name: Tests
        run: cargo test --workspace

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

  rendimiento:
    name: Regresión de rendimiento
    # Solo en Linux: los umbrales están calibrados contra una máquina de referencia y compararlos
    # entre tres sistemas distintos daría rojos que no significan nada. Lo que se vigila aquí es
    # la tendencia del código, no la máquina.
    #
    # Corre también en cada push, y es una apuesta consciente: la velocidad es el argumento del
    # producto y se pierde en un push cualquiera sin que nadie se entere. El riesgo es el otro
    # lado de la misma moneda — los runners compartidos varían entre ejecuciones, así que un día
    # dará rojo sin que el código haya empeorado. **Si eso empieza a pasar, la salida no es subir
    # el umbral hasta que no detecte nada**, es dejar este trabajo solo para las ejecuciones
    # manuales, añadiendo aquí:
    #
    #   if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      # En `--release` a propósito: en debug el motor va un orden de magnitud más lento y el test
      # no afirma sobre los números. Ver la cabecera de `tests/regresion_rendimiento.rs`.
      - name: Medir
        run: cargo test --release -p crawlforge-core --test regresion_rendimiento -- --nocapture

  fixtures:
    name: Cada regla dispara su fixture
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      # Va en su propio trabajo porque es el test que de verdad dice si el catálogo funciona:
      # rastrea de verdad el fixture de cada regla y exige que produzca su hallazgo. Un rojo aquí
      # significa que una regla ha dejado de detectar lo que dice detectar.
      - name: Banco de fixtures
        run: cargo test -p crawlforge-core --test fixtures_de_reglas -- --nocapture
