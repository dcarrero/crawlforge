# Publishes the three public crates to crates.io for a release.
#
# Called by `release.yml` (generated by dist: `publish-jobs = ["./publish-crates"]` in
# `dist-workspace.toml`) once the binaries are built and before the release is announced. It is
# not meant to be run by hand.
#
# Authentication is crates.io **Trusted Publishing**: GitHub hands the job an OIDC token, crates.io
# exchanges it for a token that lives as long as the job, and there is no long-lived secret in the
# repository. crates.io checks the *calling* workflow, so each crate's Trusted Publishing entry
# names `release.yml`, not this file. Until the owner has published the first version by hand and
# set that up for each crate, the authentication step fails; see CONTRIBUTING.md, "Cutting a
# release".
#
# Order matters: crawlforge-rules, then crawlforge-core (depends on rules), then crawlforge (the
# CLI, depends on both). `cargo publish` waits until each version is visible in the index before
# returning, so the next one resolves it.
#
# Safe to re-run: a version that is already on crates.io is skipped, and when all three are, the
# job ends without asking crates.io for a token.

name: Publish crates

on:
  workflow_call:
    inputs:
      plan:
        description: "The dist plan (dist-manifest.json) of this release"
        required: true
        type: string

permissions:
  contents: read
  id-token: write

env:
  CARGO_TERM_COLOR: always
  CRATES: "crawlforge-rules crawlforge-core crawlforge"

jobs:
  publish:
    name: Publish to crates.io
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - name: Check the version and what is left to publish
        id: pending
        env:
          PLAN: ${{ inputs.plan }}
        run: |
          set -euo pipefail
          tag="$(jq -r '.announcement_tag' <<<"$PLAN")"
          metadata="$(cargo metadata --no-deps --format-version 1)"
          pending=""
          for crate in $CRATES; do
            version="$(jq -r --arg n "$crate" '.packages[] | select(.name == $n) | .version' <<<"$metadata")"
            if [ -z "$version" ]; then
              echo "::error::$crate is not a package of this workspace"
              exit 1
            fi
            # The tag is the version being released; a crate at another version is a release
            # cut wrong, and publishing it would put the wrong code under that number.
            if [ "v$version" != "$tag" ]; then
              echo "::error::$crate is at $version but the tag is $tag"
              exit 1
            fi
            status="$(curl -s -o /dev/null -w '%{http_code}' \
              -A 'crawlforge-release (https://github.com/dcarrero/crawlforge)' \
              "https://crates.io/api/v1/crates/$crate/$version")"
            case "$status" in
              200) echo "$crate $version is already on crates.io: skipped" ;;
              404) echo "$crate $version will be published"; pending="$pending $crate" ;;
              *)   echo "::error::crates.io answered $status for $crate $version"; exit 1 ;;
            esac
          done
          echo "crates=${pending# }" >> "$GITHUB_OUTPUT"

      - name: Authenticate with crates.io (Trusted Publishing)
        if: steps.pending.outputs.crates != ''
        id: auth
        uses: rust-lang/crates-io-auth-action@v1

      - name: Publish
        if: steps.pending.outputs.crates != ''
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
          PENDING: ${{ steps.pending.outputs.crates }}
        run: |
          set -euo pipefail
          # $PENDING keeps the order of $CRATES: rules, core, CLI.
          for crate in $PENDING; do
            echo "::group::cargo publish -p $crate"
            cargo publish -p "$crate" --locked
            echo "::endgroup::"
          done
