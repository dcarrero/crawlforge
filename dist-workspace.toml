[workspace]
members = ["cargo:."]

# Config for 'dist'
[dist]
# The preferred dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.34.0"
# CI backends to support
ci = "github"
# The installers to generate for each app
installers = ["shell", "powershell", "homebrew"]
# A GitHub repo to push Homebrew formulas to
tap = "dcarrero/homebrew-tap"
# Publish jobs to run in CI. `./publish-crates` is ours (`.github/workflows/publish-crates.yml`):
# it publishes crawlforge-rules, crawlforge-core and crawlforge to crates.io with Trusted
# Publishing. See CONTRIBUTING.md, "Cutting a release".
publish-jobs = ["homebrew", "./publish-crates"]
# Target platforms to build apps for (Rust target-triple syntax)
targets = [
  "aarch64-apple-darwin",
  "x86_64-apple-darwin",
  "x86_64-unknown-linux-gnu",
  "aarch64-unknown-linux-gnu",
  "x86_64-pc-windows-msvc",
]
# Path that installers should place binaries in
install-path = "CARGO_HOME"
# Whether to install an updater program
install-updater = false
# The archive format to use for non-Windows builds
unix-archive = ".tar.gz"
# Only the command line is distributed; the other crates are libraries
dist = false

# Trusted Publishing needs the OIDC token; the checkout needs to read the repository. Without this
# dist grants `id-token` and `packages`, and an explicit list leaves `contents` at none.
[dist.github-custom-job-permissions]
publish-crates = { id-token = "write", contents = "read" }

[dist.github-custom-runners]
aarch64-unknown-linux-gnu = "ubuntu-24.04-arm"
