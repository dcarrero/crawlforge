# The package is `crawlforge`, so `cargo install crawlforge` and the release archives
# (`crawlforge-<target>.tar.gz`, `crawlforge-installer.sh`) carry the name of the command. The
# folder keeps its old name: it is not visible to anyone who installs the tool, and renaming it
# would break every `crawlforge-cli/src/...` reference in comments and in the history.
[package]
name = "crawlforge"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = true
repository.workspace = true
homepage.workspace = true
description = "Technical SEO auditor for sites you own: crawl, audit, store in SQLite and diff two crawls"
documentation = "https://github.com/dcarrero/crawlforge/blob/main/docs/MANUAL.md"
# The repository README, copied into the package by cargo: it is the page crates.io shows.
readme = "../../README.md"
keywords = ["seo", "audit", "crawler", "sqlite", "cli"]
categories = ["command-line-utilities", "web-programming", "development-tools"]

# The library keeps its old name so `use crawlforge_cli::...` stays as it is in `main.rs` and in
# the tests; without this line it would follow the package and become `crawlforge`.
[lib]
name = "crawlforge_cli"
path = "src/lib.rs"

[[bin]]
name = "crawlforge"
path = "src/main.rs"

[dependencies]
crawlforge-core.workspace = true
crawlforge-rules.workspace = true
rusqlite.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_norway.workspace = true
anyhow.workspace = true
clap.workspace = true
indicatif.workspace = true
url.workspace = true
csv.workspace = true
rust_xlsxwriter.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
fluent-bundle.workspace = true
unicode-width.workspace = true

[target.'cfg(unix)'.dependencies]
libc.workspace = true

# Solo la línea de comandos se distribuye como binario (ver dist-workspace.toml).
[package.metadata.dist]
dist = true
