<!DOCTYPE html>
<!-- CANON-RELATIVE: el canonical se declara como referencia relativa. Resuelve a la propia
     URL, así que la página sigue siendo indexable: el defecto es la forma de la etiqueta,
     no a dónde apunta. -->
<html lang="es">
<head>
<meta charset="utf-8">
<title>Una página con canonical relativo</title>
<meta name="description" content="Una descripción correcta, de longitud suficiente para no llamar la atención de otras reglas del catálogo.">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="canonical" href="/">
</head>
<body>
<main><h1>Un encabezado correcto</h1>
<p>El canonical no lleva esquema ni host: si este HTML se sirve desde otro dominio, apuntará allí.</p></main>
</body>
</html>
