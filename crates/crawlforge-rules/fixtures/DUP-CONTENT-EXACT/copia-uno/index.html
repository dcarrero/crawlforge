<!DOCTYPE html>
<!-- Copia idéntica. Este fichero y el de /copia-dos/ tienen que ser iguales byte a byte: el
     hash es del HTML servido, así que basta una coma de diferencia para que la regla no vea el
     duplicado. Por eso no llevan canonical: cualquier canonical sería distinto en cada una. -->
<html lang="es">
<head>
<meta charset="utf-8">
<title>Una página que existe dos veces</title>
<meta name="description" content="Esta descripción se repite palabra por palabra en la otra copia, porque el fichero entero es el mismo.">
<meta name="viewport" content="width=device-width, initial-scale=1">
</head>
<body>
<main><h1>El mismo encabezado en las dos copias</h1>
<p>El mismo texto, el mismo HTML y dos URLs distintas sirviéndolo.</p></main>
</body>
</html>
