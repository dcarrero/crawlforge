<!DOCTYPE html>
<!-- INDEX-NOINDEX-IN-SITEMAP: el sitemap declara /oculta/, que lleva meta robots noindex.
     Las dos señales se contradicen: el sitemap dice «indexa esto» y la página dice «no». -->
<html lang="es">
<head>
<meta charset="utf-8">
<title>Portada de un sitio con una contradicción en el sitemap</title>
<link rel="canonical" href="https://fixture.local/">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Portada que enlaza a una página marcada como no indexable pero declarada en el sitemap.">
</head>
<body><main><h1>Portada</h1><a href="/oculta/">Página con noindex</a></main></body>
</html>
