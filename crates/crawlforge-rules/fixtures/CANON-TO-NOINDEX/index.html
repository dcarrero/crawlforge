<!DOCTYPE html>
<!-- CANON-TO-NOINDEX: el canonical apunta a /bloqueada/, que se declara noindex. Las dos
     señales se contradicen y lo normal es perder las dos URLs. -->
<html lang="es">
<head>
<meta charset="utf-8">
<title>Una página que canoniza a una noindex</title>
<meta name="description" content="Una descripción correcta, de longitud suficiente para no llamar la atención de otras reglas del catálogo.">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="canonical" href="https://fixture.local/bloqueada/">
</head>
<body>
<main><h1>Un encabezado correcto</h1>
<p>El canonical señala a una página que pide no ser indexada.</p>
<a href="/bloqueada/">La URL del canonical</a></main>
</body>
</html>
