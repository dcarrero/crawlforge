<!DOCTYPE html>
<!-- ASSET-IMG-NO-ALT: la segunda imagen no trae atributo `alt`.
     La primera sí lo trae y la tercera lleva un `alt=""` de imagen decorativa fuera de todo
     enlace, que es HTML correcto: el fixture existe para demostrar que la regla distingue las
     tres cosas y solo avisa de la de en medio.
     Es un directorio y no un fichero suelto porque las imágenes tienen que existir de verdad;
     si no, el rastreo las daría por rotas y el fixture documentaría dos defectos a la vez. -->
<html lang="es">
<head>
<meta charset="utf-8">
<title>Una galería con una imagen sin texto alternativo</title>
<meta name="description" content="Una descripción correcta, de longitud suficiente para no llamar la atención de otras reglas.">
<link rel="canonical" href="https://fixture.local/">
<meta name="viewport" content="width=device-width, initial-scale=1">
</head>
<body>
<main><h1>Un encabezado correcto</h1>
<p>De las tres imágenes de abajo, solo una está mal descrita.</p>
<img src="/img/con-alt.svg" alt="Un cuadrado con el logotipo" width="64" height="64">
<img src="/img/sin-alt.svg" width="64" height="64">
<img src="/img/decorativa.svg" alt="" width="64" height="64">
</main>
</body>
</html>
