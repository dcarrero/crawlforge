<!DOCTYPE html>
<!-- CANON-MISSING: página indexable que no declara rel=canonical. -->
<html lang="es">
<head>
<meta charset="utf-8">
<title>Una página sin canonical</title>
<meta name="description" content="Una descripción correcta, de longitud suficiente para no llamar la atención de otras reglas.">
<meta name="viewport" content="width=device-width, initial-scale=1">
</head>
<body>
<main><h1>Un encabezado correcto</h1>
<p>Esta página no dice cuál es su URL canónica.</p></main>
</body>
</html>
