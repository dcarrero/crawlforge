<!DOCTYPE html>
<!-- META-REFRESH: la página redirige con <meta http-equiv="refresh"> en lugar de con un 301.
     El destino no existe en el fixture a propósito: un meta refresh no es un enlace y el motor
     no lo sigue, así que no debe aparecer como enlace roto. -->
<html lang="es">
<head>
<meta charset="utf-8">
<meta http-equiv="refresh" content="5; url=/destino/">
<title>Una página que redirige con meta refresh</title>
<meta name="description" content="Una descripción correcta, de longitud suficiente para no llamar la atención de otras reglas.">
<link rel="canonical" href="https://fixture.local/">
<meta name="viewport" content="width=device-width, initial-scale=1">
</head>
<body>
<main><h1>Un encabezado correcto</h1>
<p>Con cinco segundos de retardo, además, el botón de volver del navegador queda atrapado.</p></main>
</body>
</html>
