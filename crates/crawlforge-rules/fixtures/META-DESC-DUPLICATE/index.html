<!DOCTYPE html>
<!-- META-DESC-DUPLICATE: hacen falta dos páginas indexables con la misma meta description.
     Por eso este fixture es un directorio y no un fichero suelto. Los títulos sí son distintos,
     para que el defecto documentado sea uno solo. -->
<html lang="es">
<head>
<meta charset="utf-8">
<title>La primera página, con su propio título</title>
<meta name="description" content="La descripción por defecto del sitio, que nadie se molestó en sobrescribir página por página.">
<link rel="canonical" href="https://fixture.local/">
<meta name="viewport" content="width=device-width, initial-scale=1">
</head>
<body>
<main><h1>Primera página</h1>
<p>Enlaza a la segunda para que el rastreo la alcance.</p>
<a href="/otra/">La otra página</a></main>
</body>
</html>
