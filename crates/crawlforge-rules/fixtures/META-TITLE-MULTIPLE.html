     segunda, que es la que se escribió con cuidado, no se usa. -->
<html lang="es">
<head>
<meta charset="utf-8">
<title>Una página con dos etiquetas de título</title>
<title>El título que el plugin añadió y nadie ve</title>
<meta name="description" content="Una descripción correcta, de longitud suficiente para no llamar la atención de otras reglas.">
<link rel="canonical" href="https://fixture.local/">
<meta name="viewport" content="width=device-width, initial-scale=1">
</head>
<body>
<main><h1>Un encabezado correcto</h1>
<p>El navegador se queda con el primer título y descarta el segundo en silencio.</p></main>
</body>
</html>
