<!DOCTYPE html>
<!-- INDEX-SITEMAP-ERROR: el sitemap.xml de al lado tiene una etiqueta sin cerrar. El buscador
     deja de leerlo donde encuentra el error, así que las URLs que vienen detrás no se
     descubren por esa vía y nada lo avisa. -->
<html lang="es">
<head>
<meta charset="utf-8">
<title>Portada de un sitio con el sitemap mal formado</title>
<link rel="canonical" href="https://fixture.local/">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="El sitemap declara varias URLs pero su XML se corta a la mitad, así que solo se descubre lo que hay antes del error.">
</head>
<body><main><h1>Portada</h1><a href="/otra/">Otra página</a></main></body>
</html>
