<!DOCTYPE html>
<!-- ASSET-IMG-EMPTY-ALT-LINK: el enlace de la cabecera solo contiene una imagen con `alt=""`,
     así que se queda sin nombre accesible. Es el caso real del logotipo que enlaza a la portada.
     El segundo enlace lleva la misma imagen con el mismo `alt=""` pero además texto propio, que
     es la forma correcta: el fixture demuestra que la regla no avisa de ese.
     Es un directorio y no un fichero suelto porque la imagen tiene que existir; si no, el
     rastreo la daría por rota y el fixture documentaría dos defectos a la vez. -->
<html lang="es">
<head>
<meta charset="utf-8">
<title>Una cabecera cuyo logotipo enlaza sin nombre accesible</title>
<meta name="description" content="Una descripción correcta, de longitud suficiente para no llamar la atención de otras reglas.">
<link rel="canonical" href="https://fixture.local/">
<meta name="viewport" content="width=device-width, initial-scale=1">
</head>
<body>
<main><h1>Un encabezado correcto</h1>
<p>El primer enlace no tiene más contenido que la imagen decorativa; el segundo sí.</p>
<a href="/"><img src="/img/logo.svg" alt="" width="64" height="64"></a>
<a href="/"><img src="/img/logo.svg" alt="" width="64" height="64"> Volver a la portada</a>
</main>
</body>
</html>
