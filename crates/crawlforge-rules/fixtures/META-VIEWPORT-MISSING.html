<!DOCTYPE html>
<!-- META-VIEWPORT-MISSING: no hay <meta name="viewport">, así que el móvil compone la página a
     980 px y la reduce. La indexación es móvil primero: eso es lo que Google evalúa. -->
<html lang="es">
<head>
<meta charset="utf-8">
<title>Una página sin meta viewport declarado</title>
<meta name="description" content="Una descripción correcta, de longitud suficiente para no llamar la atención de otras reglas.">
<link rel="canonical" href="https://fixture.local/">
</head>
<body>
<main><h1>Un encabezado correcto</h1>
<p>En un móvil esta página se dibuja a 980 px de ancho y se encoge hasta ser ilegible.</p></main>
</body>
</html>
