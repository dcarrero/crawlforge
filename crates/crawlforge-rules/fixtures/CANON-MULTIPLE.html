<!DOCTYPE html>
<!-- CANON-MULTIPLE: dos <link rel="canonical"> en la misma página, el caso real de la
     plantilla y el plugin de SEO emitiendo la etiqueta cada uno por su cuenta. Los dos
     apuntan a la propia URL, así que el único defecto de la página es tener dos. -->
<html lang="es">
<head>
<meta charset="utf-8">
<title>Una página con dos canonical</title>
<meta name="description" content="Una descripción correcta, de longitud suficiente para no llamar la atención de otras reglas del catálogo.">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="canonical" href="https://fixture.local/">
<link rel="canonical" href="https://fixture.local/">
</head>
<body>
<main><h1>Un encabezado correcto</h1>
<p>La plantilla declara el canonical y el plugin de SEO lo declara otra vez.</p></main>
</body>
</html>
