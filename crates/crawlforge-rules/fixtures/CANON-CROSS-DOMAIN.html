<!DOCTYPE html>
<!-- CANON-CROSS-DOMAIN: el canonical apunta a un host distinto del de la página. El host no se
     diferencia solo en el `www.`, que no contaría: es otro dominio entero. -->
<html lang="es">
<head>
<meta charset="utf-8">
<title>Una página que canoniza a otro dominio</title>
<meta name="description" content="Una descripción correcta, de longitud suficiente para no llamar la atención de otras reglas del catálogo.">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="canonical" href="https://origen-externo.example/articulo/">
</head>
<body>
<main><h1>Un encabezado correcto</h1>
<p>Esta página regala su posicionamiento a un dominio que no controlamos.</p></main>
</body>
</html>
