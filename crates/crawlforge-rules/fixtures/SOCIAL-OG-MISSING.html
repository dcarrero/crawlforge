<!DOCTYPE html>
<!-- SOCIAL-OG-MISSING: el tema pinta og:title y se olvida de og:description y og:image, que es
     el caso más común. Un hallazgo por página, con las dos que faltan en el detalle. -->
<html lang="es">
<head>
<meta charset="utf-8">
<title>Artículo sin tarjeta de enlace completa</title>
<meta name="description" content="Esta página tiene una meta description correcta y un og:title, pero le faltan og:description y og:image, así que ninguna red social puede montar la tarjeta.">
<link rel="canonical" href="https://fixture.local/">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta property="og:title" content="Artículo sin tarjeta de enlace completa">
</head>
<body>
<main>
<h1>Un artículo cualquiera</h1>
<p>Compartido en WhatsApp, LinkedIn o Slack, este enlace aparece como una URL desnuda: la red no
tiene ni descripción ni imagen con las que construir la vista previa.</p>
</main>
</body>
</html>
