<!DOCTYPE html>
<!-- META-DESC-TOO-SHORT: diecinueve caracteres, por debajo de los setenta a partir de los cuales
     la descripción usa el espacio del fragmento. -->
<html lang="es">
<head>
<meta charset="utf-8">
<title>Una página con la descripción demasiado corta</title>
<meta name="description" content="Página de contacto.">
<link rel="canonical" href="https://fixture.local/">
<meta name="viewport" content="width=device-width, initial-scale=1">
</head>
<body>
<main><h1>Un encabezado correcto</h1>
<p>Con tan poco texto, Google tiende a ignorar la descripción y a componer el fragmento solo.</p></main>
</body>
</html>
