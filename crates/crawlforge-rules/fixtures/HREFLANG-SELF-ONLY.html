<!DOCTYPE html>
<!-- HREFLANG-SELF-ONLY: the page declares hreflang, but both entries —its language and
     x-default— point at itself. There is no alternate in the set, so the annotation does
     nothing. It is the page whose translation the plugin stopped linking. -->
<html lang="es">
<head>
<meta charset="utf-8">
<title>Página con hreflang pero sin traducciones enlazadas</title>
<meta name="description" content="Esta página declara un conjunto hreflang que solo la contiene a ella misma, así que la anotación no hace nada.">
<link rel="canonical" href="https://fixture.local/">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="alternate" hreflang="es" href="https://fixture.local/">
<link rel="alternate" hreflang="x-default" href="https://fixture.local/">
<meta property="og:title" content="Página con hreflang pero sin traducciones enlazadas">
<meta property="og:description" content="Un conjunto hreflang de uno.">
</head>
<body>
<main>
<h1>Versión en español</h1>
<p>Si existe una versión en inglés, su enlace se perdió; si no existe, la anotación sobra.</p>
</main>
</body>
</html>
